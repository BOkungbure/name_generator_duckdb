version: 2

seeds:
  - name: raw_products
    description: >
      Small, version-controlled product catalog used as reference data.
      Customer and transaction batches are loaded directly into Neon by
      scripts/load_to_neon.py rather than managed as dbt seeds.
    columns:
      - name: product_id
        description: "{{ doc('product_id') }}"
      - name: product_name
        description: Name of the stock item.
      - name: category
        description: Product category, e.g. 'Confectionery', 'Electronics', 'Novelty Items'.
      - name: unit_price
        description: List price for one unit of this product.
