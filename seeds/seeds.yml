version: 2

seeds:
  - name: raw_names
    description: >
      Raw synthetic customer data generated by scripts/generate_names.py
      (Python + Faker). Regenerated and reloaded daily by
      scripts/daily_run.ps1. Treat this as a landing/source table only —
      downstream models should reference stg_names, not this seed directly.
    columns:
      - name: id
        description: "{{ doc('name_id') }}"
      - name: user_id
        description: "{{ doc('user_id') }}"
      - name: full_name
        description: "{{ doc('full_name') }}"
      - name: email
        description: "{{ doc('email') }}"
      - name: gender
        description: Randomly assigned, one of 'female' or 'male'.
      - name: birthdate
        description: Randomly generated date of birth (age 18-90 at generation time).

  - name: raw_sales_transactions
    description: >
      Raw synthetic sales transactions generated by
      scripts/generate_sales_transactions.py, modeled loosely on the
      Microsoft Wide World Importers sample. Each row references a
      user_id from raw_names and a product_id from raw_products. Treat
      this as a landing/source table only — downstream models should
      reference stg_sales_transactions.
    columns:
      - name: transaction_id
        description: "{{ doc('transaction_id') }}"
      - name: user_id
        description: "{{ doc('user_id') }}"
      - name: product_id
        description: "{{ doc('product_id') }}"
      - name: total_amount
        description: "{{ doc('total_amount') }}"
      - name: region
        description: "{{ doc('region') }}"

  - name: raw_products
    description: >
      Static synthetic product catalog generated by
      scripts/generate_products.py, modeled loosely on the stock items in
      the Microsoft Wide World Importers sample. Unlike the other seeds,
      this is a fixed reference table (no --rows/--seed) rather than a
      randomly generated one. Treat this as a landing/source table only —
      downstream models should reference stg_products.
    columns:
      - name: product_id
        description: "{{ doc('product_id') }}"
      - name: product_name
        description: Name of the stock item.
      - name: category
        description: Product category, e.g. 'Confectionery', 'Electronics', 'Novelty Items'.
      - name: unit_price
        description: List price for one unit of this product.
