version: 2

models:
  - name: stg_products
    description: >
      Cleaned, typed 1:1 view over the raw_products seed. One row per
      stock item in the product catalog. This is the "product dimension"
      that stg_sales_transactions joins against via product_id.
    columns:
      - name: product_id
        description: "{{ doc('product_id') }}"
        tests:
          - unique
          - not_null
      - name: product_name
        description: Name of the stock item.
        tests:
          - not_null
      - name: category
        description: Product category, e.g. 'Confectionery', 'Electronics', 'Novelty Items'.
        tests:
          - not_null
      - name: unit_price
        description: List price for one unit of this product.
        tests:
          - not_null
