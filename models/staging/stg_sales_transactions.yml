version: 2

models:
  - name: stg_sales_transactions
    description: >
      Synthetic sales transactions modeled loosely on the Wide World
      Importers sample, each tied to a customer via user_id.
    columns:
      - name: transaction_id
        description: "{{ doc('transaction_id') }}"
        tests:
          - unique
          - not_null
      - name: user_id
        description: "{{ doc('user_id') }}"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_names')
                field: user_id
      - name: product_id
        description: "{{ doc('product_id') }}"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: total_amount
        description: "{{ doc('total_amount') }}"
        tests:
          - not_null
      - name: region
        description: "{{ doc('region') }}"
